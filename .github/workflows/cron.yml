# docs/18-MONETIZACAO-PLANO.md §L.5 — a decisão de cron, e o item P-0 do sequenciamento.
#
# O estado que motivou este arquivo: existiam SEIS rotas de cron construídas, protegidas por
# CRON_SECRET, e o vercel.json com `{"crons": []}`. Nenhuma jamais rodou em produção — incluindo
# `recompute-cycles`, que É o Motor de Ciclo, o diferencial que sustenta o preço do produto.
#
# Por que GitHub Actions e não Vercel Cron:
#   - Vercel Hobby trava em UMA execução por dia (o limite de 100 jobs/projeto de jan/2026 é de
#     quantidade, não de frequência). Não serve para nada que precise rodar de hora em hora.
#   - Vercel Pro resolve por US$ 20/mês ≈ R$ 110 — que, no unit economics da Fase F, são 2,4
#     assinantes Essencial trabalhando só para pagar o agendador.
#   - Aqui o custo é R$ 0, as rotas já existem e o CI já roda neste repositório.
#
# O que se perde, e está aceito: `schedule` do GitHub Actions não é pontual — atrasa em horário
# de pico e pode pular execução. Para recomputar ciclo e segmento, atraso de minutos é irrelevante.
# No dia em que existir um job que não pode atrasar, aí o Vercel Pro se justifica — e a essa
# altura ele já estará pago por dezenas de assinantes.

name: cron

on:
  schedule:
    # SEIS horários — e desde 30/08 eles não têm mais nada a ver com fuso horário.
    #
    # A HISTÓRIA, porque ela se repetiu três vezes e o padrão importa mais que o número:
    #
    #   25/08 — as rotas exigiam hora local EXATA do tenant (3h para o Motor de Ciclo, 4h para
    #           segmentos). O disparo pedido para 06:10 UTC aconteceu às 07:06. 56 minutos de
    #           atraso, hora local virou 4:06, caiu fora: ZERO tenants, HTTP 200, job verde.
    #   26/08 — conserto: a igualdade virou uma JANELA de 3 horas, e estes seis horários foram
    #           escolhidos para cobrir hora local 3 e 4 nos quatro fusos do Brasil.
    #   30/08 — medido com `gh run list`: o atraso REAL do `schedule` do GitHub nesta base é de
    #           5 a 6,5 HORAS. Os seis disparos nominais abaixo aconteceram às 11:38, 12:39,
    #           13:09, 13:48, 14:24 e 15:02 UTC. Todos os tenants são UTC-3, ou seja hora local
    #           8,6 a 12,0 — contra uma janela elegível de 3h-5h. Nenhum disparo pegou nenhum
    #           tenant, seis vezes por dia, por dois dias e meio. Verde o tempo todo.
    #
    # A LIÇÃO: `schedule` do GitHub Actions é best-effort e atrasa em HORAS, não em minutos.
    # Enquanto a rota depender do relógio do disparo, existe um atraso que a zera — e alargar a
    # janela só empurra o problema. Por isso as rotas agendadas **deixaram de olhar a hora local**
    # e passam por todos os tenants em todo disparo. Reprocessar o mesmo tenant no mesmo dia é
    # upsert por PK (TICKET-036), então isso é economia de processamento que não vale o risco.
    # `tests/unit/server/cron-sobrevive-a-atraso.test.ts` guarda esse invariante.
    #
    # Então por que ainda SEIS horários, se nenhum deles precisa acertar hora nenhuma? Por
    # redundância: `schedule` também PULA execução, e seis tentativas por dia significam que o
    # Motor de Ciclo só fica um dia sem rodar se o GitHub falhar seis vezes seguidas. O custo
    # continua sendo ~11% da cota de Actions do repositório.
    - cron: '10 5 * * *'
    - cron: '10 6 * * *'
    - cron: '10 7 * * *'
    - cron: '10 8 * * *'
    - cron: '10 9 * * *'
    - cron: '10 10 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'O que rodar agora'
        required: true
        default: os-dois-seguros
        type: choice
        # Sem opção de string vazia: `choice` com item vazio renderiza uma linha em branco no menu
        # e eu não consigo validar aqui como o parser do GitHub a trata. Um sentinela nomeado custa
        # o mesmo, não deixa dúvida, e ainda diz no próprio menu o que a opção padrão faz.
        options:
          - os-dois-seguros
          - recompute-cycles
          - segments
          - stock-alerts
          - jobs
          - reminders
          - campaigns

permissions:
  contents: read

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  seguros:
    # Só os jobs que APENAS calculam e gravam no próprio banco. Nenhum deles fala com o mundo
    # externo, então ligá-los não pode alcançar cliente final de nenhum tenant.
    name: jobs de cálculo
    runs-on: ubuntu-latest
    # `event_name` em vez de comparar a entrada com vazio: no evento `schedule` não existe
    # `inputs`, e depender de como a expressão trata ausente é o tipo de detalhe que só falha em
    # produção, às 3h da manhã, em silêncio.
    if: github.event_name == 'schedule' || github.event.inputs.job == 'os-dois-seguros'
    strategy:
      fail-fast: false
      matrix:
        rota: [recompute-cycles, segments]
    steps:
      - name: bater na rota ${{ matrix.rota }}
        env:
          BASE: ${{ secrets.CRON_BASE_URL }}
          SEGREDO: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${SEGREDO:-}" ]; then
            echo "::error::faltam os secrets CRON_BASE_URL e/ou CRON_SECRET no repositório"
            exit 1
          fi
          codigo=$(curl -sS -o /tmp/resposta.json -w '%{http_code}' \
            --max-time 300 --retry 2 --retry-delay 15 --retry-connrefused \
            -H "Authorization: Bearer ${SEGREDO}" \
            "${BASE}/api/cron/${{ matrix.rota }}")
          echo "HTTP ${codigo}"
          cat /tmp/resposta.json
          echo
          # 2xx passa; qualquer outra coisa falha o job para aparecer no e-mail do Actions.
          case "$codigo" in 2*) exit 0 ;; *) echo "::error::${{ matrix.rota }} devolveu ${codigo}"; exit 1 ;; esac

  sob_demanda:
    # Disparo manual, um de cada vez. Serve para `stock-alerts` e `jobs`, que ainda não foram
    # auditados quanto a efeito externo (`jobs` processa a fila, e a fila pode conter envio).
    name: job sob demanda
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job != 'os-dois-seguros'
    steps:
      - name: bater na rota ${{ github.event.inputs.job }}
        env:
          BASE: ${{ secrets.CRON_BASE_URL }}
          SEGREDO: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          codigo=$(curl -sS -o /tmp/resposta.json -w '%{http_code}' \
            --max-time 300 \
            -H "Authorization: Bearer ${SEGREDO}" \
            "${BASE}/api/cron/${{ github.event.inputs.job }}")
          echo "HTTP ${codigo}"
          cat /tmp/resposta.json
          echo
          case "$codigo" in 2*) exit 0 ;; *) exit 1 ;; esac

# ---------------------------------------------------------------------------------------------
# DELIBERADAMENTE FORA DO `on.schedule`: `reminders` e `campaigns`.
#
# As duas MANDAM MENSAGEM PARA CLIENTE FINAL de verdade — `reminders` dispara confirmação e
# lembrete de agendamento, `campaigns` dispara campanha. Ligar essas rotas num `schedule` é
# começar a falar com gente de verdade, e essa não é uma decisão que se toma dentro de um
# arquivo de YAML — fica para quando o dono do produto decidir, à mão.
#
# O que já mudou desde que este comentário foi escrito (`docs/25-ESTRATEGIA-E-EXECUCAO.md`, F0):
#   - `dom-rocha` e `ruivo-barber` (tenants de demonstração, `src/core/tenants/demonstracao.ts`)
#     agora são excluídos DENTRO das próprias rotas — nunca recebem mensagem, ligado ou não o
#     schedule. O antigo passo "conferir se dom-rocha é gente real ou semente" está resolvido
#     por código, não precisa mais de checagem manual para ESSES dois tenants especificamente.
#   - Existe um teto diário de envio por tenant (`src/server/services/mensageria.ts`,
#     `dentroDoTetoDiario`) — um laço não manda mais que N mensagens/dia, mesmo com o schedule
#     ligado.
#   - `campaigns` agora grava heartbeat (`send_campaigns`) e `/api/health` já checa os dois jobs.
#
# O que ainda falta, e continua exigindo decisão humana antes de ligar o `schedule`:
#   1. confirmar que WHATSAPP_PHONE_NUMBER_ID / ACCESS_TOKEN / APP_SECRET existem (TICKET-043) —
#      sem eles o provider levanta erro e cai no fallback de e-mail, que TAMBÉM é envio real;
#   2. para QUALQUER tenant real (não-demo — hoje isso é `lang-barber`, e qualquer outro que
#      passar a existir): confirmar que telefone/e-mail dos clientes são de gente real que
#      espera receber mensagem do salão, não resíduo de teste;
#   3. rodar uma vez por `workflow_dispatch` (já disponível no menu acima), olhar `messages`,
#      e só então descomentar as linhas de `schedule` abaixo;
#   4. ativar o step de CI que falha o Action quando `/api/health` reportar
#      `send_reminders`/`send_campaigns` atrasado.
#
#      ATUALIZADO em 26/08: este passo NÃO depende mais dos três acima. O motivo original era que
#      "um heartbeat que nunca rodou está sempre atrasado por definição" — e esse mesmo raciocínio
#      valia para o `/api/health`, que por causa disso vivia em 503 na produção (medido: 454 min
#      de atraso de um job que ninguém dispara). Desde `src/core/cron/agendadas.ts`, o endpoint só
#      cobra execução de rota que ESTÁ neste `schedule`; as outras aparecem no corpo com a
#      dispensa escrita. Quando `reminders`/`campaigns` entrarem aqui embaixo, a vigilância delas
#      volta sozinha — e o teste `saude-vigia-so-o-que-roda` reprova se a lista do código não
#      acompanhar este arquivo.
#
# AS LINHAS PARA DESCOMENTAR NO PASSO 4 — e por que elas mudaram em 26/08.
#
# A receita anterior era `0 12 * * *` para `campaigns`, "uma vez por dia". Ela estava ERRADA, com
# o mesmo defeito que a auditoria já tinha consertado nas outras duas rotas: `campaigns` só age no
# tenant cuja hora LOCAL é 10, e 12:00 UTC é 10h local só em UTC-2 — Fernando de Noronha, ou seja,
# ninguém. Com os 36 a 56 minutos de atraso medidos do agendador, nem lá. Descomentar aquela linha
# teria ligado a campanha para zero tenants, com HTTP 200 e job verde, exatamente como o Motor de
# Ciclo passou dois dias fazendo (`docs/24` §6.5).
#
# São quatro horários porque a rota tem hora local alvo: um por fuso, cada um caindo às 10h locais
# de um deles (a janela de 3h de `src/core/cron/janela.ts` absorve o atraso a partir daí).
# `reminders` não filtra por hora local — ela olha a hora do agendamento, não a do tenant —, então
# um `*/15` cobre todo mundo sozinho.
# `tests/unit/server/cron-cobre-os-fusos.test.ts` confere ESTAS LINHAS COMENTADAS pela mesma
# aritmética das agendadas: uma receita errada no rodapé reprova o build antes de alguém segui-la.
#
#     - cron: '*/15 * * * *'   # reminders — §7 pede a cada 15 minutos
#     - cron: '10 12 * * *'    # campaigns — 10h local em UTC-2
#     - cron: '10 13 * * *'    # campaigns — 10h local em UTC-3
#     - cron: '10 14 * * *'    # campaigns — 10h local em UTC-4
#     - cron: '10 15 * * *'    # campaigns — 10h local em UTC-5
# ---------------------------------------------------------------------------------------------
