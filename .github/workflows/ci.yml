name: CI

# Toda action de terceiro fixada por SHA de commit (auditoria de segurança, achado S14).
# Tag é ponteiro móvel: quem controla o repositório da action pode reapontar `@v4` para outro
# código, e o runner passa a executar isso sobre este repositório. Aqui o estrago seria limitado
# — este CI não tem segredo nenhum, ele sobe um Supabase efêmero — mas execução arbitrária num
# runner continua sendo execução arbitrária.
#
# Descoberto ao fixar: `supabase/setup-cli@v1` não era uma tag, era um **branch**
# (`refs/heads/v1`), que se move a cada push. Pior que tag, e passava por versão fixa.
#
# Para atualizar: pegue o SHA novo com
#   git ls-remote https://github.com/<org>/<repo> 'refs/tags/<tag>' 'refs/tags/<tag>^{}'
# e prefira o SHA de `^{}` quando existir (tag anotada aponta para o objeto da tag, não para o
# commit). O número da versão fica no comentário ao lado só para leitura humana.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um PR que recebe dois pushes seguidos não precisa gastar dois runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Regra inviolável 10: segredo nunca no repositório. Esta checagem vem antes de
  # tudo porque, se vazou chave, o resto do run é irrelevante.
  # ---------------------------------------------------------------------------
  segredos:
    name: Segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Nenhum arquivo de ambiente versionado
        run: |
          rastreados="$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$' || true)"
          if [ -n "$rastreados" ]; then
            echo "::error::Arquivo de ambiente versionado (só .env.example pode entrar):"
            echo "$rastreados"
            exit 1
          fi

      - name: Nenhuma chave service_role no código
        run: |
          # Um JWT do Supabase com "role":"service_role" tem o payload em base64url.
          # Procuramos o formato do token, não a chave em si — assim a checagem não
          # precisa conhecer nenhum segredo para reprovar.
          achados="$(git grep -nIE 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}' \
            -- ':!pnpm-lock.yaml' || true)"
          if [ -n "$achados" ]; then
            echo "::error::JWT literal encontrado em arquivo versionado:"
            echo "$achados"
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependência com vulnerabilidade conhecida
        # `high` e acima reprovam; `moderate` aparece no log sem quebrar o build,
        # senão um aviso novo em dependência transitiva trava o merge de todo
        # mundo num dia em que ninguém mexeu em dependência.
        run: |
          pnpm audit --audit-level moderate || true
          pnpm audit --audit-level high

  # ---------------------------------------------------------------------------
  # Typecheck, lint, unit e build. Não toca no banco, então roda em paralelo com
  # o job `banco` e devolve o erro barato primeiro.
  # ---------------------------------------------------------------------------
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (inclui as regras de segurança do TICKET-006)
        run: pnpm lint

      - name: Testes de unidade
        run: pnpm test:unit

      - name: Build
        # Valores de fachada: o build não pode depender de projeto real, e apontar
        # CI para credencial de produção é proibido pelo briefing (PARTE 1 §4).
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Sobe um Supabase efêmero no runner, aplica as migrations do zero e roda o
  # teste de isolamento contra ele. É aqui que "PR com RLS faltando não passa".
  # ---------------------------------------------------------------------------
  banco:
    name: Banco e RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1 (é BRANCH, não tag — ver comentário no topo)
        with:
          # Fixo, não `latest`: achado ao ligar o CI pela primeira vez (2026-08-24) — uma versão
          # mais nova do CLI mudou o que `db lint --output json` escreve quando não há achado, e
          # quebrou o parser abaixo. `latest` para o CLI é o mesmo problema do S14 em miniatura:
          # o mesmo workflow se comporta diferente amanhã sem ninguém ter mudado uma linha aqui.
          version: 2.115.0

      - name: Subir o Supabase local (aplica as migrations em banco vazio)
        run: supabase start

      - name: Exportar as credenciais do stack efêmero
        run: |
          eval "$(supabase status -o env)"

          # Trava do briefing PARTE 1 §4: CI nunca fala com projeto real.
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "::error::CI apontando para $API_URL, que não é o stack local"; exit 1 ;;
          esac

          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: supabase db lint
        run: |
          supabase db lint --local --level warning --output json > db-lint.json
          cat db-lint.json
          # O `db lint` não devolve código de saída diferente de zero por achado,
          # então quem reprova o build é esta leitura.
          node -e '
            // string vazia quando não há achado nenhum é comportamento observado de verdade
            // nesta versão do CLI (2026-08-24) — não presumido. Tratar como zero achados;
            // qualquer outra coisa ilegível vira erro visível em vez de um SyntaxError sem
            // contexto do node -e.
            const bruto = require("fs").readFileSync("db-lint.json", "utf8").trim();
            if (!bruto) process.exit(0);

            let relatorio;
            try {
              relatorio = JSON.parse(bruto);
            } catch {
              console.error("::error::supabase db lint não devolveu JSON válido:\n" + bruto);
              process.exit(1);
            }

            const erros = relatorio.flatMap((r) =>
              (r.issues ?? []).filter((i) => i.level === "error").map((i) => `${r.function ?? r.name}: ${i.message}`),
            );
            if (erros.length) {
              console.error("::error::db lint encontrou erro:\n" + erros.join("\n"));
              process.exit(1);
            }
          '

      - name: Teste de integração (onboarding contra banco de verdade)
        env:
          # KEK descartável, só para o cofre do stack efêmero. Não é segredo:
          # o banco morre junto com o job, e a KEK de verdade nunca entra no CI.
          VAULT_KEK: Q0lDTE8tQ0ktS0VLLWRlc2NhcnRhdmVsLTMyYnl0ZXM=
          VAULT_KEK_VERSION: "1"
          # Achado na 4ª execução real do CI (2026-08-24): faltava desde sempre — nenhuma suíte
          # de integração toca telefone de cliente sem passar por `hashTelefone()`, que lança sem
          # isto (`telefone.ts`, de propósito: nunca hashear sem sal). Mesmo espírito do VAULT_KEK
          # acima — sal descartável, só para o banco efêmero; o sal de produção nunca entra aqui.
          PHONE_HASH_SALT: ci-descartavel-nao-e-segredo
        run: pnpm test:integration

      - name: Teste de isolamento multi-tenant
        run: pnpm test:rls

      - name: Derrubar o stack
        if: always()
        run: supabase stop --no-backup
